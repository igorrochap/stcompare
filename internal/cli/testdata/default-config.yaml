schema: openapi.json
base_url: http://localhost:8080
reports_dir: reports
schemathesis:
  seed: 12345
  workers: 1
  generation_deterministic: true
  generation_database: none
  reports:
    - junit
    - vcr
    - har
    - ndjson
  output_sanitize: false
  output_truncate: false
  extra_args: []
comparison:
  missing_resource_statuses:
    - 404
    - 410
  precondition_heuristics: []
  normalization:
    default_rules: true
    body_fields: []
    headers: []
campaigns:
  baseline:
    kind: baseline
  gpt5.6:
    kind: candidate
    agent: codex
    model: gpt-5.6
    effort: high
    adapter: coding-agent
stbench:
  hardware: harness-machine # Declared once for the harness machine.
  adapters:
    coding-agent: python examples/stbench/coding_agent_adapter.py
  adapter_timeout: 30m
  reuse_process: false
  source_dir: .
  stcompare_binary: stcompare
  prompt:
    id: stbench-default
    version: "2"
  lifecycle:
    stop: .local/stbench/stop.sh
    reset: .local/stbench/reset.sh
    build: .local/stbench/build.sh
    start: .local/stbench/start.sh
    command_timeout: 30m
    health_url: http://localhost:8080/health
    health_timeout: 30s
    health_interval: 100ms
  max_iterations: 100
  stall_window: 2
