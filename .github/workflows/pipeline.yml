name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install quality gate tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run quality gates
        run: scripts/quality.sh

  prepare-release:
    name: Prepare semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # GitPython 3.1.60 removed an API used by python-semantic-release 10.6.1.
      # Pin the last compatible version until python-semantic-release ships its fix.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install semantic release
        run: |
          python -m pip install \
            "python-semantic-release==10.6.1" \
            "GitPython==3.1.59"

      - name: Create semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v version

  build:
    name: Build ${{ matrix.release_os }}/${{ matrix.goarch }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-release.outputs.released == 'true'
    needs: [checks, prepare-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            release_os: Linux
          - goos: linux
            goarch: arm64
            release_os: Linux
          - goos: darwin
            goarch: amd64
            release_os: Darwin
          - goos: darwin
            goarch: arm64
            release_os: Darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w" -o dist/package/stcompare ./cmd/stcompare
          go build -trimpath -ldflags="-s -w" -o dist/package/stbench ./cmd/stbench
          tar -C dist/package -czf "dist/stcompare_${{ matrix.release_os }}_${GOARCH}.tar.gz" stcompare stbench

      - name: Store release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-release.outputs.released == 'true'
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt

      # GitPython 3.1.60 removed an API used by python-semantic-release 10.6.1.
      # Pin the last compatible version until python-semantic-release ships its fix.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install semantic release
        run: |
          python -m pip install \
            "python-semantic-release==10.6.1" \
            "GitPython==3.1.59"

      - name: Upload release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: semantic-release -v publish --tag "$RELEASE_TAG"
